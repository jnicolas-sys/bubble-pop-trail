<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bubble Pop Trail</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#061a2a;font-family:system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,dpr,balls=[],shots=[],parts=[],wet=0,over=false,last=0,spawn=0,score=0;const C=['#ff416c','#ffd23f','#40e0d0','#8a5cff','#ff8a3d'];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function path(t){let y=70+t*(H-190), xx=W*.5+Math.sin(t*7.2)*W*.31*Math.sin(Math.PI*Math.min(t*1.2,1));return [xx,y]}
function addBall(col){balls.unshift({t:-.03,col:col??C[(Math.random()*C.length)|0],pop:0})}for(let i=0;i<20;i++){addBall();balls[0].t=.02+i*.034}
function bubble(px,py,r,col,a=1){x.save();x.globalAlpha=a;let g=x.createRadialGradient(px-r*.35,py-r*.4,2,px,py,r);g.addColorStop(0,'rgba(255,255,255,.45)');g.addColorStop(.45,'rgba(130,220,255,.08)');g.addColorStop(1,'rgba(180,245,255,.22)');x.fillStyle=g;x.strokeStyle='rgba(220,250,255,.72)';x.lineWidth=1.4;x.beginPath();x.arc(px,py,r,0,7);x.fill();x.stroke();x.fillStyle=col;x.shadowColor=col;x.shadowBlur=10;x.beginPath();x.arc(px,py,r*.42,0,7);x.fill();x.shadowBlur=0;x.fillStyle='rgba(255,255,255,.8)';x.beginPath();x.ellipse(px-r*.35,py-r*.42,r*.18,r*.1,-.6,0,7);x.fill();x.restore()}
function popAt(i){let b=balls[i],p=path(b.t);for(let k=0;k<15;k++)parts.push({x:p[0],y:p[1],vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,r:2+Math.random()*4,a:1});balls.splice(i,1);score+=10;if(navigator.vibrate)navigator.vibrate(18);tone()}
let ac;function tone(){try{ac??=new AudioContext();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=420+Math.random()*180;g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.07);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.07)}catch(e){}}
function check(i){if(i<0||i>=balls.length)return;let col=balls[i].col,a=i,b=i;while(a>0&&balls[a-1].col===col)a--;while(b<balls.length-1&&balls[b+1].col===col)b++;if(b-a+1>=3){for(let k=b;k>=a;k--)setTimeout(()=>popAt(k),35*(b-k));setTimeout(()=>check(Math.max(0,a-1)),180)}}
function shoot(tx,ty){if(over)return;let sx=W/2,sy=H-55,dx=tx-sx,dy=ty-sy,l=Math.hypot(dx,dy)||1;shots.push({x:sx,y:sy,vx:dx/l*700,vy:dy/l*700,col:C[(Math.random()*C.length)|0]});tone()}
c.addEventListener('pointerdown',e=>shoot(e.clientX,e.clientY));
function gameover(){if(over)return;over=true;if(navigator.vibrate)navigator.vibrate([80,40,140]);wet=.01}
function reset(){balls=[];shots=[];parts=[];wet=0;over=false;score=0;for(let i=0;i<18;i++){addBall();balls[0].t=.02+i*.034}}
function loop(T){let dt=Math.min((T-last)/1000,.033)||0;last=T;x.clearRect(0,0,W,H);let bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#073451');bg.addColorStop(1,'#06131f');x.fillStyle=bg;x.fillRect(0,0,W,H);
// watery trail
x.lineWidth=34;x.strokeStyle='rgba(72,190,215,.12)';x.beginPath();for(let i=0;i<=100;i++){let p=path(i/100);i?x.lineTo(...p):x.moveTo(...p)}x.stroke();x.lineWidth=2;x.strokeStyle='rgba(160,240,255,.18)';x.stroke();
// goal whirlpool
let gp=path(1);for(let j=0;j<5;j++){x.strokeStyle=`rgba(110,230,255,${.35-j*.05})`;x.lineWidth=3;x.beginPath();x.ellipse(gp[0],gp[1],34-j*5,13-j*2,T/900+j,0,5.4);x.stroke()}
if(!over){for(let b of balls)b.t+=dt*.018;if(balls.length&&balls[balls.length-1].t>.985)gameover()}
for(let b of balls){let p=path(b.t);bubble(p[0],p[1],15,b.col)}
for(let s=shots.length-1;s>=0;s--){let q=shots[s];q.x+=q.vx*dt;q.y+=q.vy*dt;bubble(q.x,q.y,14,q.col);let hit=-1,bd=1e9;for(let i=0;i<balls.length;i++){let p=path(balls[i].t),d=Math.hypot(q.x-p[0],q.y-p[1]);if(d<29&&d<bd){hit=i;bd=d}}if(hit>=0){let hp=path(balls[hit].t),insert=hit+(q.y>hp[1]?1:0),nt=balls[hit].t+(insert>hit?.017:-.017);balls.splice(insert,0,{t:nt,col:q.col});shots.splice(s,1);check(insert)}else if(q.x<-30||q.x>W+30||q.y<-30){shots.splice(s,1)}}
for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;p.a-=dt*2.8;x.globalAlpha=Math.max(0,p.a);x.fillStyle='rgba(190,245,255,.8)';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();if(p.a<=0)parts.splice(i,1)}x.globalAlpha=1;
// launcher
let aim=C[(Math.floor(T/2500))%C.length];bubble(W/2,H-55,27,aim);x.fillStyle='white';x.font='700 18px system-ui';x.textAlign='center';x.fillText('BUBBLE POP TRAIL',W/2,31);x.font='600 14px system-ui';x.fillText('Puntos '+score,W/2,52);
if(over){wet=Math.min(1,wet+dt*.55);x.fillStyle=`rgba(40,180,220,${wet*.58})`;x.fillRect(0,H*(1-wet),W,H*wet);for(let i=0;i<24;i++){let px=(i*97%W),py=(i*137+T*.025)%H;x.fillStyle=`rgba(210,250,255,${.08+wet*.18})`;x.beginPath();x.ellipse(px,py,7+(i%5)*3,15+(i%4)*5,0,0,7);x.fill()}if(wet>.7){x.fillStyle='white';x.font='900 42px system-ui';x.fillText('GAME OVER',W/2,H*.46);x.font='600 17px system-ui';x.fillText('Toca para volver a jugar',W/2,H*.52)}}requestAnimationFrame(loop)}requestAnimationFrame(loop);c.addEventListener('pointerup',()=>{if(over&&wet>.7)reset()});
</script></body></html>
