<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bubble Pop Trail</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#dff4ed;font-family:system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,dpr,balls=[],shots=[],parts=[],wet=0,over=false,last=0,score=0;const C=['#e94f64','#f1bd35','#37b7a5','#7658b5','#ef873c'];let current,next;
function rnd(){return C[(Math.random()*C.length)|0]} function ammo(){current=rnd();next=rnd()} ammo();
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function path(t){let y=82+t*(H-220),xx=W*.5+Math.sin(t*7.2)*W*.29*Math.sin(Math.PI*Math.min(t*1.18,1));return[xx,y]}
function addBall(col){balls.push({t:0,col:col||rnd()})}for(let i=0;i<20;i++){addBall();balls[i].t=.02+i*.033}
function bubble(px,py,r,col,a=1){x.save();x.globalAlpha=a;let g=x.createRadialGradient(px-r*.35,py-r*.4,1,px,py,r);g.addColorStop(0,'rgba(255,255,255,.62)');g.addColorStop(.55,'rgba(255,255,255,.08)');g.addColorStop(1,'rgba(185,225,235,.20)');x.fillStyle=g;x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=1.6;x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill();x.stroke();x.fillStyle=col;x.beginPath();x.arc(px,py,r*.39,0,Math.PI*2);x.fill();x.fillStyle='rgba(255,255,255,.75)';x.beginPath();x.ellipse(px-r*.34,py-r*.4,r*.17,r*.09,-.55,0,Math.PI*2);x.fill();x.restore()}
let ac;function tone(){try{ac??=new AudioContext();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=480+Math.random()*120;g.gain.setValueAtTime(.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.065);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.07)}catch(e){}}
function popAt(i){if(!balls[i])return;let p=path(balls[i].t);for(let k=0;k<13;k++)parts.push({x:p[0],y:p[1],vx:(Math.random()-.5)*150,vy:(Math.random()-.5)*150,r:1.5+Math.random()*3,a:1});balls.splice(i,1);score+=10;tone();navigator.vibrate?.(16)}
function check(i){if(!balls[i])return;let col=balls[i].col,a=i,b=i;while(a>0&&balls[a-1].col===col)a--;while(b<balls.length-1&&balls[b+1].col===col)b++;if(b-a+1>=3){for(let k=b;k>=a;k--)setTimeout(()=>popAt(k),32*(b-k));setTimeout(()=>check(Math.max(0,a-1)),180)}}
function shoot(tx,ty){if(over)return;let sx=W/2,sy=H-62,dx=tx-sx,dy=ty-sy,l=Math.hypot(dx,dy)||1,col=current;shots.push({x:sx,y:sy,vx:dx/l*700,vy:dy/l*700,col});current=next;next=rnd();tone()}
c.addEventListener('pointerdown',e=>{if(over&&wet>.72){reset();return}shoot(e.clientX,e.clientY)});
function gameover(){if(over)return;over=true;wet=.01;navigator.vibrate?.([90,45,150])}
function reset(){balls=[];shots=[];parts=[];wet=0;over=false;score=0;ammo();for(let i=0;i<18;i++){addBall();balls[i].t=.02+i*.033}}
function drawWater(T){let gp=path(1),gx=gp[0],gy=gp[1]+9;x.save();let rg=x.createRadialGradient(gx,gy,3,gx,gy,48);rg.addColorStop(0,'rgba(23,105,135,.95)');rg.addColorStop(.35,'rgba(61,164,184,.82)');rg.addColorStop(.7,'rgba(129,211,213,.55)');rg.addColorStop(1,'rgba(180,229,216,0)');x.fillStyle=rg;x.beginPath();x.ellipse(gx,gy,48,25,0,0,Math.PI*2);x.fill();for(let j=0;j<4;j++){x.strokeStyle=`rgba(235,255,250,${.58-j*.1})`;x.lineWidth=2;x.beginPath();x.ellipse(gx,gy,35-j*7,15-j*3,0,T/700+j*.8,T/700+j*.8+4.7);x.stroke()}x.fillStyle='rgba(255,255,255,.55)';for(let j=0;j<6;j++){let a=T/520+j*1.05,r=30+(j%2)*10;x.beginPath();x.arc(gx+Math.cos(a)*r,gy+Math.sin(a)*r*.35,2+(j%3),0,7);x.fill()}x.restore()}
function loop(T){let dt=Math.min((T-last)/1000,.033)||0;last=T;let bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#dff3e8');bg.addColorStop(.55,'#bfe5dc');bg.addColorStop(1,'#8dc9c1');x.fillStyle=bg;x.fillRect(0,0,W,H);x.lineWidth=32;x.strokeStyle='rgba(255,255,255,.22)';x.beginPath();for(let i=0;i<=100;i++){let p=path(i/100);i?x.lineTo(...p):x.moveTo(...p)}x.stroke();x.lineWidth=2;x.strokeStyle='rgba(90,155,150,.18)';x.stroke();drawWater(T);
if(!over){for(let b of balls)b.t+=dt*.017;if(balls.length&&balls[balls.length-1].t>=.94)gameover()}
for(let b of balls){let p=path(b.t);bubble(p[0],p[1],15,b.col)}
for(let s=shots.length-1;s>=0;s--){let q=shots[s];q.x+=q.vx*dt;q.y+=q.vy*dt;bubble(q.x,q.y,14,q.col);let hit=-1,bd=1e9;for(let i=0;i<balls.length;i++){let p=path(balls[i].t),d=Math.hypot(q.x-p[0],q.y-p[1]);if(d<29&&d<bd){hit=i;bd=d}}if(hit>=0){let hp=path(balls[hit].t),insert=hit+(q.y>hp[1]?1:0),nt=balls[hit].t+(insert>hit?.016:-.016);balls.splice(insert,0,{t:nt,col:q.col});shots.splice(s,1);check(insert)}else if(q.x<-30||q.x>W+30||q.y<-30)shots.splice(s,1)}
for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.a-=dt*3;x.globalAlpha=Math.max(0,p.a);x.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();if(p.a<=0)parts.splice(i,1)}x.globalAlpha=1;
// El grande ES el disparo actual; el pequeño es el siguiente
bubble(W/2,H-62,26,current);bubble(W/2+39,H-48,11,next,.88);x.fillStyle='rgba(20,68,73,.9)';x.textAlign='center';x.font='800 18px system-ui';x.fillText('BUBBLE POP TRAIL',W/2,29);x.font='650 14px system-ui';x.fillText('Puntos '+score,W/2,50);
if(over){wet=Math.min(1,wet+dt*.62);let rise=H*(1-wet);let wg=x.createLinearGradient(0,rise,0,H);wg.addColorStop(0,'rgba(220,250,250,.5)');wg.addColorStop(.18,'rgba(78,181,198,.72)');wg.addColorStop(1,'rgba(20,111,151,.88)');x.fillStyle=wg;x.fillRect(0,rise,W,H-rise);for(let i=0;i<28;i++){let px=(i*83)%W,py=(i*131+T*.045)%H;x.fillStyle=`rgba(245,255,255,${.12+wet*.2})`;x.beginPath();x.ellipse(px,py,5+i%5*2,10+i%4*4,0,0,7);x.fill()}if(wet>.72){x.fillStyle='white';x.font='900 40px system-ui';x.fillText('GAME OVER',W/2,H*.45);x.font='650 16px system-ui';x.fillText('Toca para volver a jugar',W/2,H*.51)}}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
