<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bubble Pop Trail</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#dff4ed;font-family:system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,dpr,balls=[],shots=[],parts=[],wet=0,over=false,win=false,last=0,score=0,remaining=60;const C=['#e94f64','#ef873c','#25a978','#7658b5','#171a1d'];const GAP=.043,R=19,FEED_SPEED=.018;let current,next;
function rnd(){return C[(Math.random()*C.length)|0]}function ammo(){current=rnd();next=rnd()}ammo();function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function path(t){let y=86+t*(H-230),xx=W*.5+Math.sin(t*7)*W*.28*Math.sin(Math.PI*Math.min(t*1.18,1));return[xx,y]}
function bubble(px,py,r,col,a=1){x.save();x.globalAlpha=a;let g=x.createRadialGradient(px-r*.38,py-r*.42,1,px,py,r);g.addColorStop(0,'rgba(255,255,255,.72)');g.addColorStop(.55,'rgba(255,255,255,.07)');g.addColorStop(1,'rgba(175,220,230,.19)');x.fillStyle=g;x.strokeStyle='rgba(255,255,255,.94)';x.lineWidth=1.7;x.beginPath();x.arc(px,py,r,0,7);x.fill();x.stroke();x.fillStyle=col;x.beginPath();x.arc(px,py,r*.4,0,7);x.fill();x.fillStyle='rgba(255,255,255,.78)';x.beginPath();x.ellipse(px-r*.35,py-r*.43,r*.18,r*.09,-.55,0,7);x.fill();x.restore()}
let ac;function tone(){try{ac??=new AudioContext();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=480+Math.random()*120;g.gain.setValueAtTime(.05,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.06);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.065)}catch(e){}}
function sort(){balls.sort((a,b)=>a.t-b.t)}function connectedFromRear(){sort();if(!balls.length)return -1;let end=0;for(let i=1;i<balls.length;i++){if(balls[i].t-balls[i-1].t>GAP*1.15)break;end=i}return end}function pushConnected(amount){let end=connectedFromRear();for(let i=0;i<=end;i++)balls[i].t+=amount}function makeRoom(insert){sort();for(let i=insert+1;i<balls.length;i++){let min=balls[i-1].t+GAP;if(balls[i].t<min)balls[i].t=min}}
// A feeder bubble physically enters from before the visible path. It travels forward continuously and only pushes when it touches the rear chain.
function ensureFeeder(){if(remaining<=0)return;sort();if(!balls.length||balls[0].t>=0){balls.unshift({t:-GAP,col:rnd(),feeder:true});remaining--}}
function feedChain(dt){ensureFeeder();sort();if(!balls.length)return;let rear=balls[0];if(rear.t<0){let nextT=rear.t+FEED_SPEED*dt;if(balls.length===1){rear.t=nextT}else{let contact=balls[1].t-GAP;if(nextT<=contact)rear.t=nextT;else{let push=nextT-contact;rear.t=contact;for(let i=1;i<=connectedFromRear();i++)balls[i].t+=push}}if(rear.t>=-.0001)rear.feeder=false}else if(remaining>0){balls.unshift({t:-GAP,col:rnd(),feeder:true});remaining--}}
}
function popAt(i){if(!balls[i])return;let p=path(balls[i].t);for(let k=0;k<15;k++)parts.push({x:p[0],y:p[1],vx:(Math.random()-.5)*165,vy:(Math.random()-.5)*165,r:1.5+Math.random()*3,a:1});balls.splice(i,1);score+=10;tone();navigator.vibrate?.(16)}function GapClose(){return GAP*1.35}function check(i){sort();if(!balls[i])return;let col=balls[i].col,a=i,b=i;while(a>0&&balls[a-1].col===col&&balls[a].t-balls[a-1].t<GapClose())a--;while(b<balls.length-1&&balls[b+1].col===col&&balls[b+1].t-balls[b].t<GapClose())b++;if(b-a+1>=3){let count=b-a+1;for(let k=0;k<count;k++)setTimeout(()=>popAt(a),35*k)}}
function shoot(tx,ty){if(over||win)return;let sx=W/2,sy=H-68,dx=tx-sx,dy=ty-sy,l=Math.hypot(dx,dy)||1,col=current;shots.push({x:sx,y:sy,vx:dx/l*720,vy:dy/l*720,col});current=next;next=rnd();tone()}c.addEventListener('pointerdown',e=>{if((over||win)&&wet>.72){reset();return}shoot(e.clientX,e.clientY)});function gameover(){if(over)return;over=true;wet=.01;navigator.vibrate?.([90,45,150])}function reset(){balls=[];shots=[];parts=[];wet=0;over=false;win=false;score=0;remaining=60;ammo()}
function drawWater(T){let gp=path(1),gx=gp[0],gy=gp[1]+8;x.save();let rg=x.createRadialGradient(gx,gy,2,gx,gy,50);rg.addColorStop(0,'rgba(24,105,135,.94)');rg.addColorStop(.4,'rgba(65,165,184,.78)');rg.addColorStop(1,'rgba(175,226,214,0)');x.fillStyle=rg;x.beginPath();x.ellipse(gx,gy,50,25,0,0,7);x.fill();for(let j=0;j<4;j++){x.strokeStyle=`rgba(240,255,250,${.6-j*.1})`;x.lineWidth=2;x.beginPath();x.ellipse(gx,gy,36-j*7,15-j*3,0,T/700+j,T/700+j+4.8);x.stroke()}x.restore()}
function loop(T){let dt=Math.min((T-last)/1000,.033)||0;last=T;let bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#dff3e8');bg.addColorStop(.55,'#bfe5dc');bg.addColorStop(1,'#8dc9c1');x.fillStyle=bg;x.fillRect(0,0,W,H);x.lineWidth=40;x.strokeStyle='rgba(255,255,255,.23)';x.beginPath();for(let i=0;i<=100;i++){let p=path(i/100);i?x.lineTo(...p):x.moveTo(...p)}x.stroke();x.lineWidth=2;x.strokeStyle='rgba(70,145,145,.17)';x.stroke();drawWater(T);if(!over&&!win){feedChain(dt);sort();if(balls.length&&balls[balls.length-1].t>=.935)gameover();if(remaining===0&&balls.length===0){win=true;wet=.73;navigator.vibrate?.([30,30,70])}}for(let b of balls){if(b.t>-GAP){let p=path(b.t);bubble(p[0],p[1],R,b.col)}}for(let s=shots.length-1;s>=0;s--){let q=shots[s];q.x+=q.vx*dt;q.y+=q.vy*dt;bubble(q.x,q.y,R-1,q.col);let hit=-1,bd=1e9;for(let i=0;i<balls.length;i++){if(balls[i].t<0)continue;let p=path(balls[i].t),d=Math.hypot(q.x-p[0],q.y-p[1]);if(d<R*2&&d<bd){hit=i;bd=d}}if(hit>=0){sort();let hp=path(balls[hit].t),insert=hit+(q.y>hp[1]?1:0),base=balls[hit].t+(insert>hit?GAP:-GAP);balls.splice(insert,0,{t:base,col:q.col});makeRoom(insert);shots.splice(s,1);check(insert)}else if(q.x<-40||q.x>W+40||q.y<-40)shots.splice(s,1)}for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.a-=dt*3;x.globalAlpha=Math.max(0,p.a);x.fillStyle='rgba(255,255,255,.9)';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();if(p.a<=0)parts.splice(i,1)}x.globalAlpha=1;let sx=W/2,sy=H-68;x.strokeStyle='rgba(45,130,135,.42)';x.lineWidth=5;x.beginPath();x.arc(sx,sy,32,0,7);x.stroke();x.strokeStyle='rgba(255,255,255,.65)';x.lineWidth=2;x.beginPath();x.arc(sx,sy,35,0,7);x.stroke();bubble(sx,sy,24,current);x.fillStyle='rgba(20,68,73,.72)';x.font='600 10px system-ui';x.textAlign='center';x.fillText('SIG.',sx+47,sy-19);bubble(sx+47,sy,12,next,.9);x.fillStyle='rgba(20,68,73,.9)';x.font='800 18px system-ui';x.fillText('BUBBLE POP TRAIL',W/2,28);x.font='650 14px system-ui';x.textAlign='left';x.fillText('Puntos '+score,18,51);x.textAlign='right';x.fillText('🫧 '+remaining+' restantes',W-18,51);x.textAlign='center';if(over){wet=Math.min(1,wet+dt*.62);let rise=H*(1-wet),wg=x.createLinearGradient(0,rise,0,H);wg.addColorStop(0,'rgba(225,252,250,.55)');wg.addColorStop(.2,'rgba(75,181,199,.72)');wg.addColorStop(1,'rgba(20,110,150,.88)');x.fillStyle=wg;x.fillRect(0,rise,W,H-rise);if(wet>.72){x.fillStyle='white';x.font='900 40px system-ui';x.fillText('GAME OVER',W/2,H*.45);x.font='650 16px system-ui';x.fillText('Toca para volver a jugar',W/2,H*.51)}}if(win){x.fillStyle='rgba(255,255,255,.88)';x.fillRect(0,0,W,H);x.fillStyle='#226c70';x.font='900 39px system-ui';x.fillText('¡NIVEL SUPERADO!',W/2,H*.45);x.font='650 17px system-ui';x.fillText('Toca para jugar otra vez',W/2,H*.51)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
